<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="page">
    <header>
      <nav>
        <ul>
          <li><a href="index.html"><img src="images/star-icon.svg" alt="" width="24" height="24"><span>Home</span></a></li>
          <li><a href="product.html"><img src="images/star-icon.svg" alt="" width="24" height="24"><span>Store</span></a></li>
          <li><a href="contact.html"><img src="images/star-icon.svg" alt="" width="24" height="24"><span>Contact</span></a></li>
        </ul>
      </nav>
    </header>
      <main>
        <h1>Contact Us</h1>
        <form action="#" method="post">
          <div class="form-row">
            <div class="form-field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Enter Name" required>
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="Enter Subject" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="10" cols="50" placeholder="Message Body" required></textarea>
            </div>
          </div>
          <div class="form-row">
            <button type="submit">Send</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
